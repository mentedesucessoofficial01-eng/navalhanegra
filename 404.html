<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Navalha Negra</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Bodoni Moda"; src: url("/fonts/bodoni-moda.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
    :root { --carvao: #1C1C1C; --ouro: #C9A227; --offwhite: #F4EFE6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--carvao); color: var(--offwhite); font-family: "Archivo", Arial, sans-serif; text-align: center; }
    p.rotulo { font-stretch: 80%; font-size: .74rem; letter-spacing: .3em; text-transform: uppercase; opacity: .7; }
    h1 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1; margin: 1rem 0; }
    h1 em { font-style: italic; font-weight: 400; color: var(--ouro); }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 1.7rem; margin-top: 1.5rem;
      background: var(--ouro); color: var(--carvao); text-decoration: none; font-weight: 650;
      font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; }
    a:focus-visible { outline: 2px solid var(--offwhite); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="rotulo">Erro 404</p>
    <h1>Esta página saiu <em>da cadeira</em>.</h1>
    <p>O endereço não existe ou foi alterado.</p>
    <a href="/">Voltar para a Navalha Negra</a>
  </main>
</body>
</html>
